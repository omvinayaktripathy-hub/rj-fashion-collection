<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none" aria-label="RJ Fashion Collection Royal Monogram (Dark Mode)">
  <defs>
    <!-- Royal Warm Gold Metallic Gradients -->
    <linearGradient id="rjGoldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F3" />
      <stop offset="30%" stop-color="#E8C568" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B38728" />
    </linearGradient>

    <!-- Crisp Ivory / Champagne Monogram for High Contrast against Dark Canvas -->
    <linearGradient id="rjIvoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F5EFEB" />
      <stop offset="100%" stop-color="#E5DCCE" />
    </linearGradient>

    <!-- Subtle Glow Shadow for Dark Canvas -->
    <filter id="royalGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#D4AF37" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ================= ROYAL CORONET (CROWN) ================= -->
  <g id="royal-coronet-dark" filter="url(#royalGlowDark)">
    <!-- Coronet Base Circlet Ring -->
    <path d="M 52 38 C 68 35, 92 35, 108 38 C 109 40, 108 42, 107 43 C 91 40.5, 69 40.5, 53 43 C 52 42, 51 40, 52 38 Z" fill="url(#rjGoldGradDark)" />
    
    <!-- Circlet Pearls / Gems -->
    <circle cx="56" cy="40.5" r="1.5" fill="#FFFFFF" />
    <circle cx="68" cy="39" r="1.5" fill="#FFFFFF" />
    <circle cx="80" cy="38.5" r="1.8" fill="#FFFFFF" />
    <circle cx="92" cy="39" r="1.5" fill="#FFFFFF" />
    <circle cx="104" cy="40.5" r="1.5" fill="#FFFFFF" />

    <!-- 5 Crown Peaks (Royal Fleur-de-lis & Spires) -->
    <!-- Center Central Peak (Tallest) -->
    <path d="M 77 37 Q 75 25, 80 18 Q 85 25, 83 37 Z" fill="url(#rjGoldGradDark)" />
    <circle cx="80" cy="17" r="2.2" fill="#FFFFFF" stroke="#B38728" stroke-width="0.5" />

    <!-- Left Intermediate Peak -->
    <path d="M 64 38 Q 61 29, 66 23 Q 70 29, 69 38 Z" fill="url(#rjGoldGradDark)" />
    <circle cx="66" cy="22.5" r="1.8" fill="#FFFFFF" stroke="#B38728" stroke-width="0.5" />

    <!-- Right Intermediate Peak -->
    <path d="M 91 38 Q 90 29, 94 23 Q 99 29, 96 38 Z" fill="url(#rjGoldGradDark)" />
    <circle cx="94" cy="22.5" r="1.8" fill="#FFFFFF" stroke="#B38728" stroke-width="0.5" />

    <!-- Far Left Outer Peak -->
    <path d="M 53 39 Q 49 32, 54 28 Q 58 33, 57 39 Z" fill="url(#rjGoldGradDark)" />
    <circle cx="54" cy="27.5" r="1.5" fill="#FFFFFF" />

    <!-- Far Right Outer Peak -->
    <path d="M 103 39 Q 102 33, 106 28 Q 111 32, 107 39 Z" fill="url(#rjGoldGradDark)" />
    <circle cx="106" cy="27.5" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- ================= INTERTWINED "R" AND "J" MONOGRAM ================= -->
  <!-- Classical Serif Letterforms with Crisp Ivory/Champagne Fill -->
  <g id="intertwined-monogram-dark" fill="url(#rjIvoryGrad)">
    
    <!-- --- LETTER 'R' --- -->
    <!-- Left Vertical Stem Serifs (Top & Bottom) -->
    <path d="M 40 50 L 58 50 L 58 54 L 52 54 L 52 110 L 59 110 L 59 114 L 39 114 L 39 110 L 45 110 L 45 54 L 40 54 Z" />
    
    <!-- 'R' Main Bold Stem -->
    <rect x="45" y="52" width="7" height="60" />

    <!-- 'R' Upper Curved Bowl -->
    <path d="M 49 50 C 72 49, 87 54, 87 70 C 87 84, 73 88, 51 88 L 51 81 C 68 81, 78 78, 78 69 C 78 59, 68 56, 49 56 Z" />

    <!-- 'R' Decorative Inner Counter -->
    <path d="M 52 56 L 62 56 C 72 56, 78 61, 78 69 C 78 77, 71 81, 61 81 L 52 81 Z" fill="none" />

    <!-- 'R' Sweeping Leg Intersecting into 'J' -->
    <path d="M 64 84 C 70 84, 76 88, 83 99 L 92 112 C 94 114, 98 114, 102 114 L 102 110 C 97 109, 93 105, 87 96 C 81 87, 75 83, 67 83 Z" />

    <!-- --- LETTER 'J' --- -->
    <!-- 'J' Top Serif Bar -->
    <path d="M 82 50 L 114 50 L 114 54 L 107 54 L 107 58 L 99 58 L 99 54 L 88 54 L 88 50 Z" />

    <!-- 'J' Main Vertical Stem (Interlaced behind R's bowl, in front of R's leg) -->
    <path d="M 99 54 L 99 104 C 99 119, 89 128, 73 128 C 60 128, 50 121, 46 112 L 51 108 C 55 116, 62 121, 72 121 C 85 121, 91 114, 91 102 L 91 54 Z" />

    <!-- 'J' Bottom Tail Finial Pearl Drop -->
    <circle cx="48" cy="110" r="3" />
  </g>

  <!-- ================= GOLD METALLIC FLORAL FLOURISH ================= -->
  <!-- Delicate botanical acanthus/laurel leaves curving around the bottom tail of 'J' -->
  <g id="gold-floral-flourish-dark" fill="url(#rjGoldGradDark)" stroke="#B38728" stroke-width="0.3">
    <!-- Main Flourish Vine Tendril -->
    <path d="M 72 122 C 85 125, 100 124, 112 116 C 117 113, 122 107, 124 101 C 122 103, 117 108, 111 111 C 99 117, 85 117, 72 122 Z" />

    <!-- Leaf 1 (Top pointing right) -->
    <path d="M 112 114 C 118 111, 126 109, 131 103 C 128 109, 122 115, 115 117 Z" />

    <!-- Leaf 2 (Mid-curve flourishing upward) -->
    <path d="M 103 118 C 110 118, 118 119, 124 125 C 117 124, 110 123, 104 120 Z" />

    <!-- Leaf 3 (Small accent bud) -->
    <path d="M 93 121 C 98 123, 104 126, 107 131 C 102 128, 97 126, 92 123 Z" />

    <!-- Star Sparkle ✦ Accent at Vine Tip -->
    <path d="M 132 101 Q 134 97, 136 101 Q 140 103, 136 105 Q 134 109, 132 105 Q 128 103, 132 101 Z" fill="#FFFFFF" />
  </g>
</svg>
