<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E17" />
      <stop offset="50%" stop-color="#72132A" />
      <stop offset="100%" stop-color="#2D060D" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#FEDB72" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B" />
      <stop offset="50%" stop-color="#FFF2A3" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="royalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Luxury Circular Shield -->
  <rect width="128" height="128" rx="32" fill="url(#bgGrad)" />
  <rect x="5" y="5" width="118" height="118" rx="28" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="6 3" opacity="0.85" />
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />

  <!-- Royal Crown -->
  <g filter="url(#royalShadow)">
    <path d="M40 46 L46 32 L56 42 L64 26 L72 42 L82 32 L88 46 C80 50 48 50 40 46 Z" fill="url(#goldAccent)" stroke="#7A5210" stroke-width="0.8" />
    <!-- Crown Jewels -->
    <circle cx="46" cy="30" r="2.5" fill="#FFE082" />
    <circle cx="64" cy="24" r="3" fill="#FFF2A3" />
    <circle cx="82" cy="30" r="2.5" fill="#FFE082" />
    <circle cx="64" cy="38" r="2" fill="#72132A" />
  </g>

  <!-- RJ Monogram Typography -->
  <g filter="url(#royalShadow)">
    <text x="64" y="92" 
          font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="2" 
          fill="url(#goldGrad)" 
          text-anchor="middle">
      RJ
    </text>
  </g>

  <!-- Bottom Accent Ribbon / Stars -->
  <circle cx="48" cy="106" r="1.5" fill="url(#goldAccent)" />
  <polygon points="64,103 66,108 71,108 67,111 69,116 64,113 59,116 61,111 57,108 62,108" fill="url(#goldAccent)" transform="scale(0.8) translate(16, 22)" />
  <circle cx="80" cy="106" r="1.5" fill="url(#goldAccent)" />
</svg>
