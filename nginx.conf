# RJ FASHION COLLECTION — Production Nginx Reverse Proxy & WAF Configuration
# High-Performance HTTP/2, SSL Termination & Security Hardening

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Settings (Anonymized & Structured)
    log_format main_waf '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'waf_action="$sent_http_x_waf_protection"';

    access_log /var/log/nginx/access.log main_waf;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Rate Limiting Zones (DDoS Mitigation)
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Upstream Node.js / Express Server
    upstream nodejs_backend {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name rj-fashion-collection.web.app rjfashioncollection.com www.rjfashioncollection.com;

        # Enforce HTTPS Redirect
        location / {
            return 301 https://$host$request_uri;
        }

        # ACME Challenge for Let's Encrypt SSL Certificates
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Deny access to .git and all git repository files
        location ~ /\.git {
            deny all;
            return 404;
        }

        # Deny access to all hidden dotfiles (.env, .svn, .htaccess, etc.)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name rj-fashion-collection.web.app rjfashioncollection.com www.rjfashioncollection.com;

        root /var/www/rj-fashion-collection/public;
        index index.html;

        # SSL Configuration (Modern Cipher Suite)
        ssl_certificate /etc/letsencrypt/live/rjfashioncollection.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rjfashioncollection.com/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Enterprise WAF Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self 'https://checkout.razorpay.com')" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-WAF-Protection "RJ-WAF/2.0-Active" always;

        # Client Body Constraints (Anti-Buffer Overflow)
        client_max_body_size 10M;
        client_body_buffer_size 128k;

        # -----------------------------------------------------------------
        # SECURITY RULE: DENY ALL ACCESS TO .git DIRECTORIES & REPOSITORIES
        # -----------------------------------------------------------------
        location ~ /\.git {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # Deny access to all other hidden files (.env, .DS_Store, .svn, etc.)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # Deny access to sensitive server config and database files
        location ~* \.(sqlite|sqlite3|db|env|config|log|bak|sql|md)$ {
            deny all;
            return 404;
        }

        # Static Assets Caching with Immutable Headers
        location ~* \.(?:jpg|jpeg|gif|png|ico|webp|avif|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform, max-age=2592000";
            access_log off;
            try_files $uri =404;
        }

        location ~* \.(?:css|js)$ {
            expires 1d;
            add_header Cache-Control "public, no-cache, must-revalidate";
            try_files $uri =404;
        }

        # Rate-Limited Authentication Routes
        location ~* ^/api/auth/(admin-login|login|register) {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://nodejs_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Reverse Proxy with WAF Rate Limiting
        location /api/ {
            limit_req zone=req_limit_per_ip burst=20 nodelay;
            limit_conn conn_limit_per_ip 20;

            proxy_pass http://nodejs_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Clean URLs / Single Page Fallback
        location / {
            try_files $uri $uri.html $uri/ /index.html;
        }
    }
}
